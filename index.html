<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<title>Presensi Magang MA RI</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* =====================================================================
   RANCANGAN VISUAL
   Tata letak : login terbelah (panel institusi + formulir); layar Intern satu kolom
                mobile dengan bilah aksi menempel di bawah (zona jempol); layar Admin
                lebar dengan header menempel, kartu statistik, filter, dan tabel.
   Warna      : hijau zamrud tua (#064e3b) sebagai dasar institusi, emas (#b45309/#d97706)
                hanya untuk aksi utama dan penekanan. Warna status (hijau/kuning/biru/merah)
                dipisah dari warna merek.
   Tipografi  : Source Serif 4 (judul, kop surat), IBM Plex Sans (isi), IBM Plex Mono (jam, angka).
   ===================================================================== */
:root{
  --bg:#f1f5f2; --surface:#ffffff; --surface-2:#f6f9f7; --line:#d8e1dc;
  --fg:#10241b; --muted:#546a5f; --link:#0b5a43;
  --brand:#064e3b; --brand-hover:#0b6148; --brand-fg:#ffffff;
  --hero-a:#064e3b; --hero-b:#0b6148;
  --gold:#b45309; --gold-btn:#b45309; --gold-btn-fg:#ffffff; --gold-soft:#fbf0dc;
  --ok-fg:#14632f; --ok-bg:#dcf5e4; --ok-solid:#1f9d55;
  --warn-fg:#8a3d06; --warn-bg:#fdecc8; --warn-solid:#d97706;
  --info-fg:#1e4a9a; --info-bg:#dde9fb; --info-solid:#3b82f6;
  --bad-fg:#9a1c1c; --bad-bg:#fde0e0; --bad-solid:#dc2626;
  --idle-fg:#475a50; --idle-bg:#e3eae6; --idle-solid:#9fb1a7;
  --focus:#b45309; --shadow:0 1px 2px rgba(6,40,30,.06),0 8px 22px rgba(6,40,30,.07);
  --paper:#ffffff; --ink:#111111;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08130e; --surface:#0f1e17; --surface-2:#142820; --line:#24392f;
    --fg:#e7f1eb; --muted:#9bb0a4; --link:#6ee7b7;
    --brand:#0e7a5a; --brand-hover:#128f6a; --brand-fg:#ffffff;
    --hero-a:#06382b; --hero-b:#0a4a38;
    --gold:#f2aa52; --gold-btn:#d97706; --gold-btn-fg:#1c1100; --gold-soft:#33260f;
    --ok-fg:#86efac; --ok-bg:#12301f; --ok-solid:#34d399;
    --warn-fg:#fcd34d; --warn-bg:#3a2a0a; --warn-solid:#f2aa52;
    --info-fg:#93c5fd; --info-bg:#12263f; --info-solid:#7aaaf7;
    --bad-fg:#fca5a5; --bad-bg:#3b1414; --bad-solid:#f87171;
    --idle-fg:#a8b8af; --idle-bg:#1c2a24; --idle-solid:#5b7066;
    --focus:#f2aa52; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08130e; --surface:#0f1e17; --surface-2:#142820; --line:#24392f;
  --fg:#e7f1eb; --muted:#9bb0a4; --link:#6ee7b7;
  --brand:#0e7a5a; --brand-hover:#128f6a; --brand-fg:#ffffff;
  --hero-a:#06382b; --hero-b:#0a4a38;
  --gold:#f2aa52; --gold-btn:#d97706; --gold-btn-fg:#1c1100; --gold-soft:#33260f;
  --ok-fg:#86efac; --ok-bg:#12301f; --ok-solid:#34d399;
  --warn-fg:#fcd34d; --warn-bg:#3a2a0a; --warn-solid:#f2aa52;
  --info-fg:#93c5fd; --info-bg:#12263f; --info-solid:#7aaaf7;
  --bad-fg:#fca5a5; --bad-bg:#3b1414; --bad-solid:#f87171;
  --idle-fg:#a8b8af; --idle-bg:#1c2a24; --idle-solid:#5b7066;
  --focus:#f2aa52; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hero-a)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a.lnk{color:var(--link);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.min-w-0{min-width:0}

/* ---------- komponen dasar ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 1.1rem;border-radius:10px;font:inherit;font-weight:600;font-size:.93rem;border:1px solid transparent;cursor:pointer;transition:background .15s,transform .1s,opacity .15s,border-color .15s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-fg)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-gold{background:var(--gold-btn);color:var(--gold-btn-fg)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{min-height:38px;padding:0 .85rem;font-size:.85rem;border-radius:9px}
.btn-lg{min-height:56px;font-size:1rem;border-radius:14px}
.btn.is-disabled,.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.is-disabled:active{transform:none}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;color:inherit;cursor:pointer}
.icon-btn:hover{background:rgba(127,127,127,.14)}
.icon-btn.on-dark{color:#fff}
.icon-btn.on-dark:hover{background:rgba(255,255,255,.14)}
.field{display:grid;gap:.35rem}
.field>label,.lbl{font-weight:600;font-size:.84rem}
.input{width:100%;min-height:44px;padding:.5rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:.95rem}
.input:hover{border-color:var(--idle-solid)}
textarea.input{min-height:84px;resize:vertical}
.input[aria-invalid="true"]{border-color:var(--bad-solid)}
.err{color:var(--bad-fg);font-size:.8rem;min-height:0}
.hint{color:var(--muted);font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.14rem .55rem;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;line-height:1.4}
.chip-ok{background:var(--ok-bg);color:var(--ok-fg)}
.chip-warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip-info{background:var(--info-bg);color:var(--info-fg)}
.chip-bad{background:var(--bad-bg);color:var(--bad-fg)}
.chip-idle{background:var(--idle-bg);color:var(--idle-fg)}
.chip-gold{background:var(--gold-soft);color:var(--gold)}
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;letter-spacing:.02em}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--gold);animation:spin .8s linear infinite;display:inline-block}
.btn .spin{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim-in{animation:fadeUp .35s ease both}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.login-brand{background:linear-gradient(155deg,var(--hero-a),var(--hero-b));color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:2rem;padding-block:2.5rem}
.login-brand::after,.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 14px);pointer-events:none}
.login-brand>*{position:relative;z-index:1}
.login-title{font-family:var(--f-display);font-size:clamp(1.7rem,3.2vw,2.6rem);line-height:1.14;font-weight:700;text-wrap:balance;margin:0}
.gold-rule{width:56px;height:3px;background:#e0a24a;border-radius:2px}
.login-facts{display:grid;gap:.7rem;font-size:.92rem;color:rgba(255,255,255,.88);list-style:none;margin:0;padding:0}
.login-facts li{display:flex;gap:.65rem;align-items:flex-start}
.login-facts svg{color:#f0b765;flex:none;margin-top:.2rem}
.login-form-wrap{display:grid;align-content:center;padding-block:2rem}
.login-form{width:100%;max-width:420px;margin-inline:auto;display:grid;gap:1rem}
.login-h{font-family:var(--f-display);font-size:1.6rem;font-weight:700;margin:0}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:3rem}
.pw-wrap .icon-btn{position:absolute;right:2px;top:0;height:44px;width:44px;color:var(--muted)}
.demo{border:1px dashed var(--idle-solid);border-radius:12px;padding:.8rem .9rem;background:var(--surface-2)}
.demo summary{cursor:pointer;font-weight:600;font-size:.86rem}
.demo-list{display:grid;gap:.45rem;margin-top:.7rem}
.demo-item{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;padding:.5rem .6rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:inherit;font:inherit;min-height:48px}
.demo-item:hover{border-color:var(--gold)}
.demo-item small{display:block;color:var(--muted);font-size:.76rem}
.mode-tag{display:inline-flex;align-items:center;gap:.4rem;font-size:.76rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
@media (max-width:860px){
  .login{grid-template-columns:minmax(0,1fr)}
  .login-brand{padding-block:1.5rem 1.75rem;gap:1rem}
  .login-facts{display:none}
}

/* ---------- Intern ---------- */
.hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;position:relative;overflow:hidden;padding-block:14px 78px}
.hero-in{position:relative;z-index:1;max-width:520px;margin-inline:auto}
.hero-kicker{font-weight:600;font-size:.95rem;line-height:1.2}
.hero-sub{font-size:.76rem;color:rgba(255,255,255,.78)}
.hero-greet{margin:1.4rem 0 0;font-size:.95rem;color:rgba(255,255,255,.85)}
.hero-name{font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1.2;margin:.1rem 0 0;text-wrap:balance}
.hero-meta{font-size:.88rem;color:rgba(255,255,255,.85)}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px}
.clock{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;padding:.7rem 1rem}
.clock-t{font-size:2.35rem;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.clock-z{font-weight:600;font-size:.85rem;color:#f0c27a}
.clock-s{flex-basis:100%;font-size:.78rem;color:rgba(255,255,255,.8)}
.main-in{max-width:520px;margin:-54px auto 0;position:relative;z-index:2;display:grid;gap:14px;padding-bottom:176px}
.status-card{padding:1.1rem 1.1rem 1.15rem}
.status-top{display:flex;align-items:center;gap:.85rem}
.status-badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.tone-idle{background:var(--idle-bg);color:var(--idle-fg)}
.tone-ok{background:var(--ok-bg);color:var(--ok-fg)}
.tone-warn{background:var(--warn-bg);color:var(--warn-fg)}
.tone-info{background:var(--info-bg);color:var(--info-fg)}
.tone-bad{background:var(--bad-bg);color:var(--bad-fg)}
.status-label{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.15}
.status-desc{margin:.8rem 0 0;color:var(--muted);font-size:.9rem}
.triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:1rem 0 0}
.triple>div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;min-width:0}
.triple dt{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.triple dd{margin:.15rem 0 0;font-size:1.02rem;font-weight:500}
.triple .sub{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.cd{display:flex;align-items:center;gap:.5rem;margin-top:.9rem;padding:.6rem .8rem;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-weight:600;font-size:.88rem}
.pad-card{padding:1rem 1.1rem}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-top:.7rem;text-align:left}
.mini3 .n{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;line-height:1.2}
.mini3 .l{font-size:.76rem;color:var(--muted)}
.hist{display:grid;margin-top:.4rem}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.65rem 0;border-top:1px solid var(--line);font-size:.88rem}
.hist-row:first-child{border-top:0}
.hist-row .d{font-weight:600}
.hist-row .t{font-size:.78rem;color:var(--muted)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.ab-in{max-width:520px;margin-inline:auto}
.ab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ab-note{font-size:.76rem;color:var(--muted);text-align:center;margin-top:.35rem;min-height:1.1rem}

/* ---------- Admin ---------- */
.adm-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:linear-gradient(90deg,var(--hero-a),var(--hero-b));color:#fff}
.adm-wrap{max-width:1440px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.adm-title{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.15}
.adm-sub{font-size:.76rem;color:rgba(255,255,255,.78)}
.adm-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.adm-clock{font-size:.85rem;color:#f0c27a;font-weight:600}
.adm-clock .mono{color:#fff;font-size:1.05rem;font-weight:500}
.adm-user{display:flex;align-items:center;gap:.55rem;font-size:.82rem;line-height:1.2}
.adm-user small{display:block;color:rgba(255,255,255,.75);font-size:.72rem}
.adm-main{max-width:1440px;margin-inline:auto;padding-block:22px 56px;display:grid;gap:16px}
.page-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h{font-family:var(--f-display);font-size:1.6rem;font-weight:700;margin:0;line-height:1.2}
.live{display:inline-flex;align-items:center;gap:.45rem;font-size:.78rem;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok-solid);box-shadow:0 0 0 0 var(--ok-solid);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.45)}70%{box-shadow:0 0 0 8px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.stat-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stat-grid>.stat:first-child{grid-column:1/-1}
@media (min-width:1024px){.stat-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.stat-grid>.stat:first-child{grid-column:auto}}
.stat{padding:1rem 1.1rem;display:grid;gap:.15rem;align-content:start}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.stat .lab{font-size:.8rem;font-weight:600;color:var(--muted)}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.stat .n{font-family:var(--f-mono);font-size:2.2rem;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.stat .cap{font-size:.76rem;color:var(--muted)}
.prog{padding:1rem 1.2rem}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.prog-pct{font-family:var(--f-mono);font-size:1.9rem;font-weight:500}
.seg{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--idle-bg);margin-top:.6rem}
.seg>span{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin-top:.7rem;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.4rem;vertical-align:-1px}
.banner{display:flex;gap:.6rem;align-items:center;padding:.7rem .9rem;border-radius:12px;background:var(--info-bg);color:var(--info-fg);font-size:.86rem;font-weight:500}
.filters{padding:1rem 1.1rem;display:grid;gap:.9rem}
.f-row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end}
.f-row .field{min-width:0}
.f-search{flex:1 1 260px;position:relative}
.f-search svg{position:absolute;left:.8rem;bottom:.8rem;color:var(--muted);pointer-events:none}
.f-search .input{padding-left:2.4rem}
.seg-ctrl{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-ctrl button{min-height:42px;padding:0 .9rem;border:0;background:transparent;color:inherit;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer}
.seg-ctrl button+button{border-left:1px solid var(--line)}
.seg-ctrl button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}
.seg-ctrl button:not([aria-pressed="true"]):hover{background:var(--surface-2)}
.tbl-card{overflow:hidden}
.tbl-head{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.9rem 1.1rem;border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;min-width:1080px;border-collapse:collapse;font-size:.86rem}
.tbl th{position:sticky;top:0;text-align:left;padding:.65rem .8rem;background:var(--surface-2);color:var(--muted);font-size:.71rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .num{color:var(--muted);width:44px}
.th-btn{display:inline-flex;align-items:center;gap:.3rem;border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;min-height:24px}
.th-btn[aria-pressed="true"]{color:var(--fg)}
.name-btn{display:flex;align-items:center;gap:.6rem;border:0;background:transparent;padding:.15rem .3rem .15rem 0;cursor:pointer;color:inherit;font:inherit;text-align:left;border-radius:8px;min-width:0}
.name-btn:hover .nm{text-decoration:underline;text-underline-offset:2px;color:var(--link)}
.nm{font-weight:600;display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{font-size:.74rem;color:var(--muted)}
.cell-time{display:flex;flex-direction:column;gap:.25rem;align-items:flex-start}
.thumbs{display:flex;gap:.4rem}
.thumb{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);object-fit:cover;display:block;cursor:zoom-in}
.thumb-btn{padding:0;border:0;background:transparent;border-radius:9px;cursor:zoom-in;position:relative}
.thumb-btn span{position:absolute;bottom:-2px;right:-2px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:.6rem;font-weight:600;padding:0 .25rem;color:var(--muted)}
.loc-cell{display:grid;gap:.15rem;font-size:.8rem}

function buildSeed() {
  const rnd = mulberry32(20261103), pick = a => a[Math.floor(rnd() * a.length)];
  const now = wibNow(), users = SEED_USERS.map(u => ({ ...u })), att = new Map();
  const jitter = () => offsetPos(8 + rnd() * 125, rnd() * 360);
  const base = (u, d) => ({ id: `${u.uid}_${d}`, uid: u.uid, nama: u.nama, nim: u.nim, idMagang: u.idMagang, tanggal: d, ket: '', manual: false, lateMin: 0, jamMasuk: null, jamPulang: null, lat: null, lng: null, latOut: null, lngOut: null, fotoMasuk: null, fotoPulang: null, lokasiTeks: '' });
  function presence(u, d, inSec, outS) {
    const r = base(u, d), sc = statusFromSec(inSec), p = jitter();
    Object.assign(r, { status: sc.status, lateMin: sc.lateMin, jamMasuk: sec2t(inSec), lat: p.lat, lng: p.lng, fotoMasuk: `seed|${u.uid}|${fmtShort(d)} ${hhmm(sec2t(inSec))} WIB` });
    if (outS) { const q = jitter(); Object.assign(r, { jamPulang: sec2t(outS), latOut: q.lat, lngOut: q.lng, fotoPulang: `seed|${u.uid}|${fmtShort(d)} ${hhmm(sec2t(outS))} WIB` }); }
    return r;
  }
  const interns = users.filter(u => u.role === 'intern');
  for (const u of interns) {
    const t = u.traits;
    for (const d of eachDay(addDays(now.date, -75), addDays(now.date, -1))) {
      if (!isWork(d)) continue;
      const r = rnd(); let acc = 0, rec = null;
      if (r < (acc += t.alpa)) continue;
      if (r < (acc += t.sakit)) { rec = base(u, d); Object.assign(rec, { status: 'sakit', ket: pick(KET_SAKIT), manual: true, inputOleh: 'Dra. Retno Wulandari, M.H.' }); }
      else if (r < (acc += t.izin)) { rec = base(u, d); Object.assign(rec, { status: 'izin', ket: pick(KET_IZIN), manual: true, inputOleh: 'Dra. Retno Wulandari, M.H.' }); }
      else if (r < (acc += t.dinas)) { rec = base(u, d); const k = pick(KET_DINAS); Object.assign(rec, { status: 'dinas', ket: k, lokasiTeks: k.replace('Dinas luar: ', ''), manual: true, inputOleh: 'Dra. Retno Wulandari, M.H.' }); }
      else {
        const late = rnd() < t.late;
        const inS = late ? WORK.inSec + (1 + Math.round(-Math.log(1 - rnd()) * t.avgLate)) * 60 + Math.floor(rnd() * 60) : WORK.inSec - 30 - Math.floor(rnd() * 35 * 60);
        const outS = outSec(d) + Math.floor(rnd() * rnd() * 40 * 60);
        rec = presence(u, d, inS, outS);
      }
      att.set(rec.id, rec);
    }
  }
  /* Hari ini: sebagian sudah absen, satu dinas luar, satu belum absen (Clara) */
  if (isWork(now.date)) {
    const plan = { u1: '07:48:12', u2: '08:14:27', u3: '07:55:41', u4: '08:33:05', u5: '07:41:50' };
    for (const [uid, tm] of Object.entries(plan)) {
      if (toSec(tm) <= toSec(now.time)) { const u = users.find(x => x.uid === uid); const r = presence(u, now.date, toSec(tm), null); att.set(r.id, r); }
    }
    const u6 = users.find(x => x.uid === 'u6'), r6 = base(u6, now.date);
    Object.assign(r6, { status: 'dinas', ket: KET_DINAS[0], lokasiTeks: KET_DINAS[0].replace('Dinas luar: ', ''), manual: true, inputOleh: 'Dra. Retno Wulandari, M.H.' });
    att.set(r6.id, r6);
  }
  return { users, att };
}

async function startCamera() {

/* ---- kamera simulasi (kanvas) ---- */
function drawSim(ctx, t, u, off) {
  const W = 480, H = 640, i = hashCode(u.uid), skin = SKIN[i % SKIN.length], hair = HAIR[(i >> 2) % HAIR.length];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2c4a40'); g.addColorStop(1, '#13211b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(34, 70, 110, 250); ctx.fillRect(344, 40, 96, 190);
  const dx = (off ? 190 : 0) + Math.sin(t / 900) * 6, bob = Math.sin(t / 1300) * 3, cx = 240 + dx, cy = 292 + bob;
  if (u.f) { ctx.fillStyle = hair; ctx.beginPath(); ctx.ellipse(cx, cy + 30, 134, 186, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#1e2f3f'; ctx.beginPath(); ctx.ellipse(cx, 650, 210, 190, 0, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2f2ee'; ctx.beginPath(); ctx.moveTo(cx - 36, 470); ctx.lineTo(cx + 36, 470); ctx.lineTo(cx, 535); ctx.fill();
  ctx.fillStyle = skin; ctx.fillRect(cx - 40, cy + 100, 80, 90);
  ctx.beginPath(); ctx.ellipse(cx, cy + 14, 118, 154, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hair; ctx.beginPath(); ctx.ellipse(cx, cy - 66, 118, 58, 0, Math.PI, Math.PI * 2); ctx.fill();
  const blink = (t % 3600) < 120 ? 1 : 6;
  ctx.fillStyle = '#2a1b14';
  ctx.beginPath(); ctx.ellipse(cx - 42, cy + 2, 12, blink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 42, cy + 2, 12, blink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a3b2b'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy + 70, 28, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}

/* ---- deteksi wajah ----
   Face detector "mock yang stabil": memakai FaceDetector bawaan browser bila ada, bila tidak
   memindai piksel warna kulit di dalam bingkai oval (ruang warna YCbCr) dengan histeresis
   agar tidak berkedip. Untuk akurasi produksi, ganti dengan face-api.js:
     await faceapi.nets.tinyFaceDetector.loadFromUri('/models');
     const det = await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions());
   lalu petakan det.box ke fungsi nativeDetect() di bawah. (Model face-api tidak bisa
   diunduh dari dalam pratinjau Artifact, itu sebabnya dipakai detektor ringan ini.) */
const dc = document.createElement('canvas'); dc.width = 60; dc.height = 80;
const dctx = dc.getContext('2d', { willReadFrequently: true });
function drawCover(ctx, src, sw, sh, dw, dh, mirror) {
  const sr = sw / sh, dr = dw / dh; let sx = 0, sy = 0, w = sw, h = sh;
  if (sr > dr) { w = sh * dr; sx = (sw - w) / 2; } else { h = sw / dr; sy = (sh - h) / 2; }
  ctx.save(); if (mirror) { ctx.translate(dw, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, sx, sy, w, h, 0, 0, dw, dh); ctx.restore();
}
function skinState(src, sw, sh) {
  drawCover(dctx, src, sw, sh, 60, 80, false);
  const d = dctx.getImageData(0, 0, 60, 80).data;
  let inS = 0, inT = 0, outS = 0, outT = 0;
  for (let y = 0; y < 80; y++) for (let x = 0; x < 60; x++) {
    const k = (y * 60 + x) * 4, r = d[k], g = d[k + 1], b = d[k + 2];
    const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b, cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
    const skin = cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173 && r > 60 && r > b;
    const nx = (x - 30) / 20, ny = (y - 38) / 27;
    if (nx * nx + ny * ny <= 1) { inT++; if (skin) inS++; } else { outT++; if (skin) outS++; }
  }
  const inR = inS / inT, outR = outS / outT;

  if (inR >= 0.12) return 'adjust';
  return 'none';
}
async function nativeDetect(video, sw, sh) {
  A.fd = A.fd || new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
  const faces = await A.fd.detect(video);
  if (!faces.length) return 'none';
  const b = faces[0].boundingBox, fr = 3 / 4; let cw = sw, ch = sh, ox = 0, oy = 0;
  if (sw / sh > fr) { cw = sh * fr; ox = (sw - cw) / 2; } else { ch = sw / fr; oy = (sh - ch) / 2; }
  const cx = ((b.x + b.width / 2) - ox) / cw, cy = ((b.y + b.height / 2) - oy) / ch, w = b.width / cw;
  return Math.abs(cx - .5) < .16 && Math.abs(cy - .47) < .18 && w > .34 && w < .82 ? 'ok' : 'adjust';
}
async function detectTick() {
  if (A.step !== 'live' || A.detecting || !A.camMode || A.camMode === 'error') return;
  A.detecting = true;
  try {
    const real = A.camMode === 'real', src = real ? $('#camVideo') : $('#camSim');
    const sw = real ? src.videoWidth : src.width, sh = real ? src.videoHeight : src.height;
    let st = 'none';
    if (sw && sh) {
      if (real && window.FaceDetector) { try { st = await nativeDetect(src, sw, sh); } catch (e) { st = skinState(src, sw, sh); } }
      else st = skinState(src, sw, sh);
    }
    if (st === 'ok') { A.streak++; A.miss = 0; } else { A.miss++; A.streak = 0; }
    if (st === 'ok' && A.streak >= 3) A.faceOk = true;
    if (st !== 'ok' && A.miss >= 2) A.faceOk = false;
    const key = A.faceOk ? 'ok' : st === 'ok' ? 'stab' : st;
    setFaceUI(A.faceOk ? 'ok' : st === 'none' ? 'none' : 'adjust', FACE_ON[key]);
    updateAttend();
  } finally { A.detecting = false; }
}
function setFaceUI(state, msg) {
  const cam = $('#cam'); if (!cam) return;
  cam.classList.toggle('is-ok', state === 'ok');
  cam.classList.toggle('is-adjust', state === 'adjust');

/* ---- lokasi / geofencing ---- */
function getPosition() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ ok: false, code: 0 });
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    setTimeout(() => fin({ ok: false, code: 3 }), 12000);
    try { navigator.geolocation.getCurrentPosition(p => fin({ ok: true, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), e => fin({ ok: false, code: e.code }), { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }); }
    catch (e) { fin({ ok: false, code: 0 }); }

}
function setLoc(lat, lng, acc) {

}
function applySimLoc() { const m = { inside: 35, edge: 138, outside: 640 }[A.simLoc], p = offsetPos(m, 40); setLoc(p.lat, p.lng, 12); }
async function locate() {

  else if (ALLOW_SIM) { A.locSim = true; applySimLoc(); }

  return `<li class="check chk-${st}"><span class="chk-ic">${ic}</span><div class="min-w-0" style="flex:1"><div class="chk-t">${title}</div><div class="chk-d">${detail}</div></div>${extra}</li>`;
}
function attReady() {
  const l = A.loc;
  if (l.state === 'loading') return { ok: false, msg: 'Menunggu lokasi GPS…' };
  if (l.state === 'outside') return { ok: false, msg: `Anda berada ${Math.round(l.dist)} m dari titik kantor. Batas absensi ${OFFICE.radius} m.` };
  if (l.state === 'error') return { ok: false, msg: 'Lokasi tidak tersedia. Izinkan akses lokasi lalu coba lagi.' };
  if (A.camMode === 'error') return { ok: false, msg: 'Kamera tidak tersedia. Izinkan akses kamera lalu coba lagi.' };
  if (!A.camMode) return { ok: false, msg: 'Menyiapkan kamera…' };
  if (!A.faceOk) return { ok: false, msg: 'Wajah belum terdeteksi di dalam bingkai.' };
  return { ok: true, msg: '' };
}
function updateAttend() {

  else if (l.state === 'outside') locRow = checkRow('bad', 'Di luar area absensi', `${Math.round(l.dist)} m dari titik kantor (batas ${OFFICE.radius} m). Mendekatlah ke kantor lalu ulangi.${A.locSim ? ' · simulasi' : ''}`, retry);
  else locRow = checkRow('bad', 'Lokasi tidak tersedia', ({ 1: 'Izin lokasi ditolak. Aktifkan izin lokasi di pengaturan browser.', 2: 'Posisi perangkat tidak dapat ditentukan.', 3: 'Waktu pencarian lokasi habis.' })[l.code] || 'Perangkat tidak mendukung lokasi.', retry);

  else if (!A.camMode) faceRow = checkRow('wait', 'Wajah', 'Menyiapkan kamera…');

    sim.innerHTML = `<p>${ico('info', 'w-4 h-4')}<span><b>Mode simulasi.</b> Pratinjau Artifact tidak mengizinkan kamera dan GPS perangkat, jadi tombol di bawah dipakai untuk menguji logika absensi.</span></p>

    note.textContent = 'Periksa foto dan data. Presensi yang sudah dikirim tidak dapat diubah sendiri.';

}

function attShot() {
  const r = attReady();
  if (!r.ok) { toast(r.msg, 'warn'); return; }
  const when = wibNow();
  if (A.type === 'pulang' && toSec(when.time) < outSec(when.date)) { toast(`Belum waktunya pulang. Absen pulang dibuka pukul ${hhmm(sec2t(outSec(when.date)))} WIB.`, 'warn'); return; }
  const c = document.createElement('canvas'); c.width = 480; c.height = 640; const x = c.getContext('2d');
  if (A.camMode === 'real') { const v = $('#camVideo'); drawCover(x, v, v.videoWidth, v.videoHeight, 480, 640, true); }
  else x.drawImage($('#camSim'), 0, 0, 480, 640);
  const g = x.createLinearGradient(0, 520, 0, 640); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.75)');
  x.fillStyle = g; x.fillRect(0, 520, 480, 120);
  x.fillStyle = '#fff'; x.font = '600 20px "IBM Plex Sans",sans-serif'; x.fillText(S.me.nama, 16, 590);
  x.fillStyle = '#f3c98b'; x.font = '500 16px "IBM Plex Mono",monospace'; x.fillText(`${fmtShort(when.date)} ${when.time} WIB`, 16, 614);
  x.fillStyle = '#fff'; x.font = '14px monospace'; x.fillText(`${A.loc.lat.toFixed(5)}, ${A.loc.lng.toFixed(5)}${A.camMode === 'sim' ? ' · SIMULASI' : ''}`, 16, 634);
  A.shot = c.toDataURL('image/jpeg', 0.72); A.when = when; A.step = 'review';
  stopCamera();
  const im = $('#camShot'); im.src = A.shot; im.hidden = false; $('#camVideo').hidden = true; $('#camSim').hidden = true;
  updateAttend();
}
function attRetake() {

}
async function attSend() {
  if (A.busy) return;
  A.busy = true; updateAttend();
  const w = A.when, l = A.loc, me = S.me, id = `${me.uid}_${w.date}`, ex = Store.att.get(id);
  let rec;

    const sc = statusFromSec(toSec(w.time));
    rec = { id, uid: me.uid, nama: me.nama, nim: me.nim || '', idMagang: me.idMagang || '', tanggal: w.date, status: sc.status, lateMin: sc.lateMin, jamMasuk: w.time, jamPulang: null, lat: l.lat, lng: l.lng, mapsUrl: mapsUrl(l.lat, l.lng), akurasi: Math.round(l.acc || 0), jarak: Math.round(l.dist), fotoMasuk: A.shot, fotoPulang: null, latOut: null, lngOut: null, ket: '', lokasiTeks: '', manual: false, simulasi: A.camMode === 'sim' || A.locSim };
  } else {

function countUp() {
  $$('.cnt').forEach(el => {
    const to = +el.dataset.to, key = el.dataset.k, prev = S.prevCnt[key];
    S.prevCnt[key] = to;
    if (key === 'rate') { if (el.textContent === '—') return; el.textContent = to + '%'; if (prev === undefined || prev === to || REDUCED) return; }
    else if (prev === undefined || prev === to || REDUCED) { el.textContent = to; return; }
    const t0 = performance.now(), suf = key === 'rate' ? '%' : '';
    (function f(t) { const p = Math.min(1, (t - t0) / 600); el.textContent = Math.round(prev + (to - prev) * p) + suf; if (p < 1) requestAnimationFrame(f); })(t0);
  });
}

/* ---- filter ---- */
function activeRange() {
  const t = wibNow().date, f = S.filters;
  if (f.preset === 'today') return { from: t, to: t };
  if (f.preset === 'week') return { from: weekStart(t), to: t };
  if (f.preset === 'month') return { from: monthStart(t), to: t };
  let from = f.from || t, to = f.to || t;
  if (from > to) [from, to] = [to, from];
  return { from, to };
}
function syncFilterUI() {
  const r = activeRange(), f = S.filters;
  $$('[data-act="preset"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === f.preset)));
  if (f.preset !== 'custom') { $('#fFrom').value = r.from; $('#fTo').value = r.to; }
  $('#fStatus').value = f.status;
  if ($('#fQ').value !== f.q) $('#fQ').value = f.q;
  const err = $('#fErr'); err.hidden = !f.swapped;
  if (f.swapped) err.textContent = 'Tanggal awal lebih besar dari tanggal akhir. Rentang ditukar otomatis agar data tetap tampil.';
}
const statusMatch = (f, st) => f === 'all' || f === st || (f === 'izin_sakit' && (st === 'izin' || st === 'sakit' || st === 'dinas'));
function getRows() {
  const f = S.filters, { from, to } = activeRange(), today = wibNow().date, end = to < today ? to : today, q = f.q.trim().toLowerCase(), rows = [];
  for (const u of interns()) {
    if (q && !(u.nama.toLowerCase().includes(q) || String(u.nim).toLowerCase().includes(q) || String(u.idMagang).toLowerCase().includes(q))) continue;
    for (const d of eachDay(from, end)) {
      if (!isWork(d)) continue;
      const rec = Store.att.get(`${u.uid}_${d}`);
      const r = rec ? { ...rec, u } : { id: `${u.uid}_${d}`, uid: u.uid, nama: u.nama, nim: u.nim, idMagang: u.idMagang, tanggal: d, status: d < today ? 'alpa' : 'belum', virtual: true, u, ket: '', lateMin: 0 };
      if (statusMatch(f.status, r.status)) rows.push(r);
    }
  }
  const dir = S.sort.dir === 'asc' ? 1 : -1, k = S.sort.key;
  rows.sort((a, b) => {
    let c = 0;
    if (k === 'tanggal') c = a.tanggal.localeCompare(b.tanggal);
    else if (k === 'nama') c = a.nama.localeCompare(b.nama, 'id');
    else c = (a.jamMasuk ? toSec(a.jamMasuk) : 1e9) - (b.jamMasuk ? toSec(b.jamMasuk) : 1e9);
    if (c) return c * dir;
    return k === 'tanggal' ? a.nama.localeCompare(b.nama, 'id') : b.tanggal.localeCompare(a.tanggal);
  });
  return rows;
}

  const detail = [...rows].sort((a, b) => a.nama.localeCompare(b.nama, 'id') || a.tanggal.localeCompare(b.tanggal));
  return `<div class="rpt">
    <div class="rpt-kop">${emblem(66, '#064e3b', '#b45309')}<div class="txt"><div class="l1">MAHKAMAH AGUNG REPUBLIK INDONESIA</div><div class="l2">BIRO HUKUM DAN HUMAS</div><div class="l3">Jl. Medan Merdeka Utara No. 9–13, Jakarta Pusat 10110</div></div></div>
    <hr class="rpt-rule">
    <h1>LAPORAN REKAPITULASI PRESENSI PESERTA MAGANG</h1>
    <div class="rpt-meta">Periode ${fmtLong(from)} s.d. ${fmtLong(to)}${notes.length ? '<br>Filter: ' + notes.join(', ') : ''}</div>
    <div class="rpt-sum"><div><b>${tot.hk}</b>Hari kerja tercatat</div><div><b>${tot.tepat}</b>Tepat waktu</div><div><b>${tot.terlambat}</b>Terlambat (${tot.lateMin} menit)</div><div><b>${tot.sakit + tot.izin + tot.dinas}</b>Izin / sakit / dinas</div><div><b>${tot.alpa}</b>Alpa</div></div>
    <h2>A. Ringkasan per peserta magang</h2>
    <table><thead><tr><th rowspan="2">No</th><th rowspan="2">Nama</th><th rowspan="2">NIM</th><th colspan="2">Hadir</th><th rowspan="2">Menit<br>terlambat</th><th rowspan="2">Sakit</th><th rowspan="2">Izin</th><th rowspan="2">Dinas<br>luar</th><th rowspan="2">Alpa</th><th rowspan="2">Hari<br>kerja</th><th rowspan="2">%<br>Hadir</th></tr><tr><th>Tepat</th><th>Lambat</th></tr></thead>
    <tbody>${list.length ? list.map((a, i) => `<tr><td class="c">${i + 1}</td><td>${esc(a.u.nama)}</td><td>${esc(a.u.nim)}</td><td class="c">${a.tepat}</td><td class="c">${a.terlambat}</td><td class="c">${a.lateMin}</td><td class="c">${a.sakit}</td><td class="c">${a.izin}</td><td class="c">${a.dinas}</td><td class="c">${a.alpa}</td><td class="c">${a.hk}</td><td class="c">${pct(a)}</td></tr>`).join('') : '<tr><td colspan="12" class="c">Tidak ada data pada filter ini.</td></tr>'}</tbody>
    <tfoot><tr><td colspan="3" class="c">JUMLAH</td><td class="c">${tot.tepat}</td><td class="c">${tot.terlambat}</td><td class="c">${tot.lateMin}</td><td class="c">${tot.sakit}</td><td class="c">${tot.izin}</td><td class="c">${tot.dinas}</td><td class="c">${tot.alpa}</td><td class="c">${tot.hk}</td><td class="c">${pct(tot)}</td></tr></tfoot></table>
    <div class="rpt-note">Persentase hadir = (tepat waktu + terlambat + dinas luar) ÷ hari kerja tercatat. Hari kerja Senin–Jumat. Waktu dalam WIB.</div>
    <div class="rpt-sign"><div class="box">Pembimbing Magang<div class="space"></div><div>( ............................................ )</div><div>NIP. ......................................</div></div>
      <div class="box">Jakarta, ${fmtShort(n.date).replace(/^0/, '')}<br>Kepala Biro Hukum dan Humas<div class="space"></div><div>( ............................................ )</div><div>NIP. ......................................</div></div></div>
    <div class="rpt-pb"></div>
    <h2>Lampiran. Rincian presensi harian</h2>
    <table><thead><tr><th>No</th><th>Nama</th><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Jam kerja</th><th>Status</th><th>Keterangan</th></tr></thead><tbody>
    ${detail.length ? detail.map((r, i) => `<tr><td class="c">${i + 1}</td><td>${esc(r.nama)}</td><td>${fmtShort(r.tanggal)}</td><td class="c">${r.jamMasuk || '-'}</td><td class="c">${r.jamPulang || '-'}</td><td class="c">${r.jamMasuk && r.jamPulang ? fmtDur(Math.max(0, toSec(r.jamPulang) - toSec(r.jamMasuk))) : '-'}</td><td>${ST[r.status].label}${r.status === 'terlambat' ? ` (${r.lateMin} mnt)` : ''}</td><td>${esc(r.ket || r.lokasiTeks || '')}</td></tr>`).join('') : '<tr><td colspan="8" class="c">Tidak ada data.</td></tr>'}
    </tbody></table></div>`;
}
function openReport() {
  const rows = getRows();
  if (!rows.length) { toast('Tidak ada data pada filter saat ini. Ubah filter lalu coba lagi.', 'warn'); return; }
  const d = mkDialog('dlgReport', 'dlg-report', 'Pratinjau Laporan Resmi', '', `<p class="foot-note">Unduh laporan sebagai file HTML, buka di browser, lalu tekan Ctrl+P (atau ⌘P) dan pilih "Simpan sebagai PDF". Tampilan sudah diatur untuk kertas A4.</p><div class="foot-btns"><button type="button" class="btn btn-ghost" data-act="closeDlg" data-dlg="dlgReport">Tutup</button><button type="button" class="btn btn-primary" data-act="dlReport">${ico('download', 'w-4 h-4')}Unduh Laporan (HTML siap cetak)</button></div>`);
  const body = $('#dlgReportB'); body.className = 'paper-wrap'; body.innerHTML = reportHtml();
  d.addEventListener('close', () => document.documentElement.classList.remove('rpt-open'));
  document.documentElement.classList.add('rpt-open');
  d.showModal();
}
function dlReport() {
  const { from, to } = activeRange();
  const doc = `<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Presensi Magang ${from} sd ${to}</title><style>${REPORT_CSS}@page{size:A4;margin:12mm}body{margin:0;background:#e9eeea}.rpt{max-width:794px;margin:16px auto}@media print{body{background:#fff}.rpt{margin:0;padding:0;max-width:none}}</style></head><body>${reportHtml()}</body></html>`;
  deliverFile(`laporan-presensi-magang_${from}_sd_${to}.html`, doc, 'text/html;charset=utf-8', 'Kode HTML laporan');
}

/* =====================================================================
   13. EVENT & BOOT
   ===================================================================== */
const ACT = {
  logout: () => doLogout(),
  togglePw: el => { const i = $('#liPw'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.setAttribute('aria-pressed', String(show)); el.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'); },
  demoLogin: el => { $('#liEmail').value = el.dataset.email; $('#liPw').value = el.dataset.pw; doLogin(el.dataset.email, el.dataset.pw); },
  absen: el => { const type = el.dataset.type, v = canAbsen(type, internCtx()); if (!v.ok) { toast(v.msg, 'warn'); return; } openAttend(type); },
  attClose: () => closeAttend(), attShot: () => attShot(), attRetake: () => attRetake(), attSend: () => attSend(),
  attRetryLoc: () => locate(), attRetryCam: () => { A.step = 'live'; startCamera(); },
  simLoc: el => { A.simLoc = el.dataset.v; applySimLoc(); updateAttend(); },
  simFace: () => { A.simOff = !A.simOff; A.streak = 0; updateAttend(); },
  closeDlg: el => closeDlg(el.dataset.dlg),
  preset: el => { S.filters.preset = el.dataset.p; S.filters.swapped = false; S.page = 1; syncFilterUI(); paintTable(); },
  sort: el => { const k = el.dataset.k; S.sort = S.sort.key === k ? { key: k, dir: S.sort.dir === 'asc' ? 'desc' : 'asc' } : { key: k, dir: k === 'tanggal' ? 'desc' : 'asc' }; S.page = 1; paintTable(); },
  page: el => { S.page = +el.dataset.p; paintTable(); },
  kendali: el => openKendali(el.dataset.uid),
  kPrev: () => { S.kendali.ym = shiftMonth(S.kendali.ym, -1); renderKendali(); },
  kNext: () => { const cur = wibNow().date.slice(0, 7); if (S.kendali.ym < cur) { S.kendali.ym = shiftMonth(S.kendali.ym, 1); renderKendali(); } },
  photo: el => openPhoto(el.dataset.id, el.dataset.w),
  zoomToggle: () => $('#zoomBox').classList.toggle('z'),
  openManual: () => openManual(),
  resetFilters: () => { S.filters = { q: '', preset: 'month', from: '', to: '', status: 'all', swapped: false }; S.sort = { key: 'tanggal', dir: 'desc' }; S.page = 1; syncFilterUI(); paintTable(); },
  exportCsv: () => exportCsv(), openReport: () => openReport(), dlReport: () => dlReport(), copyText: () => copyText()
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (fn) fn(el, e); });
document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); doLogin($('#liEmail').value, $('#liPw').value); }
  else if (e.target.id === 'manualForm') { e.preventDefault(); saveManual(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fQ') { S.filters.q = e.target.value; S.page = 1; paintTable(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, f = S.filters;
  if (id === 'fFrom' || id === 'fTo') {
    const t = wibNow().date;
    f.preset = 'custom'; f.from = $('#fFrom').value || t; f.to = $('#fTo').value || t; f.swapped = f.from > f.to; S.page = 1; syncFilterUI(); paintTable();
  } else if (id === 'fStatus') { f.status = e.target.value; S.page = 1; paintTable(); }
  else if (e.target.name === 'mType') toggleManualFields();
  else if (id === 'mUser' || id === 'mDate') resetManualConfirm();
});
function tick() {
  if (!S.me) return;
  if (S.me.role === 'intern') { paintInternDynamic(false); return; }
  const n = wibNow(), c = $('#clock'); if (c) c.textContent = n.time;
  if (S.lastDate !== n.date) { S.lastDate = n.date; paintAdmin(); }
}
async function boot() {
  $('#rptCss').textContent = REPORT_CSS;
  if (USE_FIREBASE) {
    try { await FirebaseSvc.init(); Svc = FirebaseSvc; }
    catch (e) { console.error(e); USE_FIREBASE = false; ALLOW_SIM = true; Svc = MockSvc; toast('Firebase gagal dimuat. Aplikasi berjalan di mode simulasi.', 'warn'); }
  }
  if (Svc === MockSvc) await MockSvc.init();
  renderLogin();
  setInterval(tick, 1000);
}
boot();

</script>
